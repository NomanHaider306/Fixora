{% extends 'base.html' %}

{% block title %}Password Reset Complete - Fixora{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card card-fx border-0 text-center p-4 p-md-5">
        <div class="bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
          <i class="bi bi-shield-check"></i>
        </div>
        <h3 class="fw-bold mb-2">Password reset successful</h3>
        <p class="text-muted small mb-4">
          Your password has been changed. You can now use your new password to log in to Fixora.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-fixora w-100">
          Log In Now &rarr;
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
