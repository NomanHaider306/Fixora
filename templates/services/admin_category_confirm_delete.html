{% extends 'base.html' %}

{% block title %}Delete Category - Admin Fixora{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card card-fx border-0 text-center p-4 p-md-5">
        <div class="bg-danger-subtle text-danger rounded-circle d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
          <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h4 class="fw-bold mb-2">Delete Service Category?</h4>
        <p class="text-muted small mb-4">
          Are you sure you want to delete category <strong>"{{ category.name }}"</strong>? This action cannot be undone.
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <a href="{% url 'services:category_list_admin' %}" class="btn btn-light w-50">Cancel</a>
            <button type="submit" class="btn btn-danger w-50">
              <i class="bi bi-trash me-1"></i> Delete
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
